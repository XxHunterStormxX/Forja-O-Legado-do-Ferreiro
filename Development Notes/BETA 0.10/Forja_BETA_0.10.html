<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Forja: O Legado do Ferreiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #120b0a; --bg: #0a0606; --p1: #261811; --p2: #160e0a; --p3: #2f1f15;
  --gold: #b9832f; --gold2: #f2c45a; --gold3: #ffe9a0; --line: #5e3f21;
  --text: #efdcae; --muted: #b8955f; --red: #e0705c; --green: #9bd46e; --blue: #6cb8f0;
  --serif: 'EB Garamond', Georgia, 'Times New Roman', serif; --title: 'Cinzel', 'EB Garamond', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: var(--serif); font-size: 16px; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, #1a0f0b 0%, #070404 75%); }
#game { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 0 2px #000, 0 0 60px rgba(0,0,0,.8); }
img.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; vertical-align: middle; flex: none; }
kbd { display: inline-block; min-width: 1.5em; padding: 0 .35em; margin: 0 .3em; border: 1px solid var(--gold); border-bottom-width: 2px; border-radius: 3px; background: #2b1c12; color: var(--gold2); font: 600 .78em var(--title); text-align: center; line-height: 1.5; }

/* ---------- placas (estilo das folhas de referência) ---------- */
.plaque { position: relative; background: linear-gradient(180deg, var(--p1), var(--p2)); border: 2px solid var(--gold); border-radius: 4px; box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 1px #3d2815, inset 0 0 18px rgba(0,0,0,.6), 0 8px 24px rgba(0,0,0,.55); }
.plaque::before, .plaque::after { content: ''; position: absolute; width: 7px; height: 7px; background: var(--gold2); transform: rotate(45deg); box-shadow: 0 0 0 1px var(--ink); top: -5px; left: -5px; }
.plaque::after { left: auto; right: -5px; }
.ribbon { display: inline-flex; align-items: center; gap: .5em; padding: .25em 1.1em; background: linear-gradient(180deg, #3a2516, #23160e); border: 2px solid var(--gold); border-radius: 999px; box-shadow: 0 0 0 2px var(--ink), inset 0 1px 0 rgba(255,230,160,.15); font: 700 1.05rem var(--title); color: var(--gold3); letter-spacing: .02em; text-shadow: 0 2px 0 #000; }
.ribbon.sm { font-size: .92rem; padding: .15em .9em; }
.ribbon small { font: 500 .8rem var(--serif); color: var(--muted); }

/* botões */
.plaque button, .win button, #title-menu button { cursor: pointer; }
.win button, #title-menu button, #dlg-opts button { background: linear-gradient(180deg, #3b2617, #24170f); border: 2px solid var(--line); border-radius: 4px; padding: .45em .9em; font: 600 1rem var(--serif); color: var(--text); box-shadow: 0 0 0 1px var(--ink), inset 0 1px 0 rgba(255,220,150,.1); transition: filter .1s, transform .05s; }
.win button:hover:not(:disabled), #title-menu button:hover:not(:disabled), #dlg-opts button:hover:not(:disabled) { filter: brightness(1.25); border-color: var(--gold); }
.win button:active:not(:disabled), #title-menu button:active:not(:disabled) { transform: translateY(1px); }
button.gold { background: linear-gradient(180deg, #a8681c, #6e4210) !important; border-color: var(--gold2) !important; color: #fff6dc !important; text-shadow: 0 1px 0 #3d2309; }
button.danger { background: linear-gradient(180deg, #7a2a22, #4a1612) !important; border-color: #c24a3c !important; }
button:disabled { opacity: .42; cursor: not-allowed !important; filter: grayscale(.5); }
button.big { font-size: 1.12rem; padding: .6em 1.2em; width: 100%; }
button.big small { display: block; font-size: .78rem; opacity: .8; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#hud > * { pointer-events: auto; }
#hud-stats { position: absolute; top: 10px; left: 10px; display: flex; gap: 14px; padding: 6px 14px 6px 10px; }
.st { display: flex; align-items: center; gap: 6px; line-height: 1.05; }
.st b { display: block; font: 700 1.05rem var(--title); color: var(--gold3); }
.st small { display: block; font-size: .78rem; color: var(--muted); }
.st.lv { border-left: 1px solid var(--line); padding-left: 12px; }
.xp { display: block; width: 110px; height: 5px; margin-top: 3px; background: #0d0806; border: 1px solid var(--line); }
.xp u, .breakdown u { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); }
#hud-btns { position: absolute; top: 10px; right: 10px; display: flex; gap: 2px; padding: 4px; }
#hud-btns button { background: none; border: 1px solid transparent; border-radius: 3px; padding: 3px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; font: 600 .66rem var(--serif); color: var(--muted); }
#hud-btns button span { white-space: nowrap; max-width: 64px; overflow: hidden; text-overflow: clip; }
#hud-btns button:hover { background: #3a2516; border-color: var(--line); color: var(--text); }
#hud-btns button.glow { animation: glow 1.2s infinite; }
.stree-wrap { display: grid; grid-template-columns: 1fr 250px; gap: 12px; align-items: start; }
.stree { position: relative; width: 100%; aspect-ratio: 640 / 500; background: radial-gradient(circle at 50% 50%, #3a210f 0%, #1a0f08 45%, #0d0805 100%); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.stree svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.stree .ring { fill: none; stroke: #3a2614; stroke-width: 1; stroke-dasharray: 2 5; }
.stree .ln { stroke-width: 3; stroke-linecap: round; } .stree .ln.lock { stroke: #2e2016; } .stree .ln.next { stroke: #5a4128; stroke-dasharray: 4 5; }
.stree .ln.can { stroke: #e0b050; stroke-dasharray: 7 5; animation: skflow 1s linear infinite; } .stree .ln.own { stroke: #f2c45a; filter: drop-shadow(0 0 3px #f2c45a); }
.stree .ex { fill: none; stroke: #b0405a; stroke-width: 2; stroke-dasharray: 3 5; opacity: .8; }
.stree .bl { fill: #c8a060; font: 700 13px var(--title); text-anchor: middle; letter-spacing: .03em; }
@keyframes skflow { to { stroke-dashoffset: -24; } }
.sn { position: absolute; transform: translate(-50%, -50%); width: 7.5%; aspect-ratio: 1; padding: 0 !important; min-width: 0 !important; border-radius: 50% !important; display: grid; place-items: center; background: #1a100a !important; border: 2px solid #4a3a2a !important; }
.sn span { display: grid; place-items: center; width: 70%; } .sn img { width: 100%; height: auto; }
.sn i { position: absolute; right: -7px; bottom: -6px; font: 700 .62rem var(--title); font-style: normal; background: #120b08; border: 1px solid #5a4128; border-radius: 8px; padding: 0 4px; color: var(--gold3); }
.sn.cap { width: 8.8%; border-width: 3px !important; } .sn.root { width: 10.5%; border-width: 3px !important; }
.sn.hyb { width: 6.4%; border-radius: 6px !important; transform: translate(-50%, -50%) rotate(45deg); } .sn.hyb span, .sn.hyb i { transform: rotate(-45deg); }
.sn.own { border-color: var(--gold2) !important; background: radial-gradient(circle, #7a5220, #2a1a0a) !important; box-shadow: 0 0 12px #f2c45a99; }
.sn.can { border-color: var(--gold) !important; animation: glow 1.6s infinite; }
.sn.next { filter: grayscale(.7) brightness(.75); } .sn.lock { filter: grayscale(1) brightness(.45); } .sn.excl { filter: grayscale(1) brightness(.35); border-color: #7a2a3a !important; }
.sn.sel { outline: 2px solid #fff3c0; outline-offset: 3px; }
.sdet { background: #120b08; border: 1px solid var(--line); border-radius: 6px; padding: 12px; text-align: center; }
.sdet h3 { margin: 4px 0 2px; color: var(--gold3); } .sdet .sd-t { color: var(--muted); font-size: .8rem; margin-bottom: 8px; } .sdet p { margin: 0 0 8px; }
.sdet ul { list-style: none; padding: 0; margin: 0 0 8px; text-align: left; font-size: .86rem; } .sdet li.ok { color: #9ed07a; } .sdet li.no { color: #d07a6a; }
.sdet .sd-ex { color: #d08aa0; font-size: .8rem; margin-bottom: 8px; } .sdet .sd-ok { color: var(--gold3); font-weight: 700; } .sdet .sd-no { color: var(--muted); }
.sdet button { width: 100%; }
@keyframes glow { 50% { background: rgba(242,196,90,.25); border-color: var(--gold2); } }
#hud-goals { position: absolute; top: 78px; right: 10px; width: 250px; padding: 8px 10px; font-size: .86rem; }
.lbl { font: 700 .82rem var(--title); color: var(--gold2); margin-bottom: 4px; letter-spacing: .02em; }
.lbl.sm { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.goal { display: flex; align-items: baseline; gap: 6px; color: var(--text); line-height: 1.3; }
.goal i { flex: none; width: 9px; height: 9px; border: 1px solid var(--gold); transform: translateY(1px); }
.goal.ok { color: var(--muted); text-decoration: line-through; }
.goal.ok i { background: var(--gold2); }
.goal em { margin-left: auto; font-style: normal; color: var(--gold2); }
.ord { display: flex; align-items: center; gap: 6px; font-size: .84rem; }
.ord span { flex: 1; } .ord em { font-style: normal; color: var(--muted); }
.ord.today em { color: var(--gold2); } .ord.late em { color: var(--red); }
#hud-wip { position: absolute; top: 74px; left: 10px; padding: 7px 10px; max-width: 360px; }
.hd { display: flex; align-items: center; gap: 8px; line-height: 1.1; }
.hd b { font: 700 .95rem var(--title); color: var(--gold3); } .hd small { display: block; color: var(--muted); font-size: .82rem; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; font-size: .76rem; color: var(--muted); background: #140c08; }
.chip.ok { color: var(--green); border-color: #4e6a2e; } .chip.cur { color: var(--gold3); border-color: var(--gold2); background: #3a2516; }
.arr { color: var(--gold); }
#prompt { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 16px; font: 600 1rem var(--serif); white-space: nowrap; cursor: pointer; }
#toasts { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(560px, 92vw); }
.toast { display: flex; align-items: center; gap: 8px; padding: 7px 14px; background: linear-gradient(180deg, #2b1b12f2, #170e0af2); border: 1px solid var(--gold); border-radius: 4px; box-shadow: 0 0 0 1px var(--ink), 0 6px 18px rgba(0,0,0,.5); font-size: .95rem; animation: tin .25s ease-out; transition: opacity .5s, transform .5s; }
.toast.out { opacity: 0; transform: translateY(-6px); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* minijogos */
#minihud { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
#mh-top { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 14px; white-space: nowrap; }
#mh-top b { font: 700 1rem var(--title); color: var(--gold3); } #mh-top .chips { margin: 0; flex-wrap: nowrap; }
#mh-hint { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: .95rem; width: max-content; max-width: 92vw; text-align: center; }

/* ---------- janelas ---------- */
.overlay { position: fixed; inset: 0; z-index: 35; display: flex; align-items: center; justify-content: center; background: rgba(6,3,2,.62); padding: 16px; animation: fade .15s; }
.overlay.clear { background: rgba(6,3,2,.25); align-items: flex-end; padding-bottom: 60px; }
.overlay.night { background: radial-gradient(ellipse at center, rgba(20,12,30,.88), rgba(2,1,4,.97)); z-index: 45; }
#result, #assembly { z-index: 44; } #modal { z-index: 55; }
@keyframes fade { from { opacity: 0; } }
.win { width: min(980px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; animation: pop .18s ease-out; }
.win.small { width: min(520px, 100%); }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.win-h { display: flex; align-items: center; justify-content: center; padding: 12px 48px 6px; position: relative; }
.win-h .x { position: absolute; right: 10px; top: 10px; width: 34px; height: 34px; padding: 0; font-size: 1rem; }
.win-b { padding: 12px 18px 18px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.win-b h3 { font: 700 1.25rem var(--title); color: var(--gold3); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.win-b h4 { font: 700 .95rem var(--title); color: var(--gold2); margin: 14px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
.win-b p { line-height: 1.4; margin: 6px 0; }
.bar-info { padding: 7px 12px; margin-bottom: 10px; background: #120b08; border: 1px solid var(--line); border-radius: 4px; font-size: .92rem; color: var(--muted); }
.bar-info b { color: var(--text); }
.gold-t { color: var(--gold2) !important; } .red { color: var(--red) !important; } .warn { color: var(--gold2); } .ok { color: var(--green); }
.empty, .note { color: var(--muted); font-style: italic; font-size: .95rem; }
.center { text-align: center; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { flex: 1; } .tabs button.on { border-color: var(--gold2); color: var(--gold3); background: linear-gradient(180deg, #4a2f1a, #2c1c11); }
.cards { display: grid; gap: 8px; }
.card { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: linear-gradient(180deg, #1f140e, #140c08); border: 1px solid var(--line); border-radius: 4px; }
.card.imp { border-color: var(--gold); box-shadow: inset 0 0 12px rgba(242,196,90,.12); }
.card.owned { opacity: .7; }
.card .ct { flex: 1; min-width: 0; }
.card .ct b { display: block; font-size: 1.05rem; color: var(--gold3); }
.card .ct small { display: block; color: var(--muted); font-size: .88rem; line-height: 1.25; }
.meta { font-size: .88rem; color: var(--muted); margin-top: 3px; }
.meta.center { margin: 6px 0; }
.tag { display: inline-block; padding: 0 7px; border: 1px solid var(--c); border-radius: 3px; color: var(--c); font: 600 .78rem var(--serif); background: rgba(0,0,0,.3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.mat { display: flex; gap: 10px; padding: 8px; background: #140c08; border: 1px solid var(--line); border-radius: 4px; }
.mat.lock { opacity: .55; }
.mat .ct { flex: 1; } .mat b { color: var(--gold3); } .mat b em { font-style: normal; color: var(--text); float: right; }
.mat small { display: block; color: var(--muted); font-size: .84rem; line-height: 1.2; min-height: 2.4em; }
.buy { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: .88rem; }
.buy span { flex: 1; color: var(--gold2); } .buy button { padding: .15em .7em; }
.lockt { color: var(--red); }
.mini-list > div { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px dashed #3a2616; font-size: .92rem; }
.mini-list em { margin-left: auto; font-style: normal; color: var(--muted); font-size: .85rem; }
.mini-list small { color: var(--muted); }
/* livro de receitas */
.book { display: grid; grid-template-columns: 230px 1fr; gap: 12px; }
.rlist { display: flex; flex-direction: column; gap: 4px; max-height: 58vh; overflow-y: auto; padding-right: 4px; }
.rit { display: flex !important; align-items: center; gap: 8px; text-align: left; padding: .3em .6em !important; }
.rit span { display: flex; flex-direction: column; line-height: 1.1; } .rit small { color: var(--muted); font-size: .78rem; }
.rit.on { border-color: var(--gold2) !important; background: linear-gradient(180deg, #4a2f1a, #2c1c11) !important; }
.rit.lock { opacity: .5; }
.rdet { padding: 10px 14px; background: #120b08; border: 1px solid var(--line); border-radius: 4px; }
.rhead { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; }
.rhead h3 { margin: 0; } .rhead small { color: var(--muted); }
.rdet .lbl { margin: 10px 0 4px; }
.chant { font: 600 1rem var(--title); color: var(--gold2); letter-spacing: .04em; }
.metals { display: flex; flex-wrap: wrap; gap: 5px; }
.metals button { display: flex; align-items: center; gap: 4px; padding: .25em .6em; font-size: .9rem; }
.metals button em { font-style: normal; color: var(--muted); margin-left: 3px; }
.metals button.on { border-color: var(--gold2); background: linear-gradient(180deg, #4a2f1a, #2c1c11); }
.need { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .92rem; }
.errl { margin-top: 8px; font-size: .95rem; }
.rdet .big { margin-top: 12px; }
/* habilidades */
.tree { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.branch { display: flex; flex-direction: column; align-items: stretch; padding: 8px; background: #120b08; border: 1px solid var(--line); border-radius: 4px; }
.bh { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; } .bh b { font: 700 .92rem var(--title); color: var(--gold2); }
.node { text-align: left; padding: .4em .6em !important; }
.node b { display: block; font-size: .98rem; } .node small { display: block; color: var(--muted); font-size: .82rem; line-height: 1.2; } .node em { display: block; font-size: .76rem; color: #c08cf0; font-style: normal; margin-top: 2px; }
.node.own { border-color: var(--gold2) !important; background: linear-gradient(180deg, #5a3a17, #36230f) !important; opacity: 1 !important; filter: none !important; }
.node.own b { color: var(--gold3); }
.node.can { border-color: var(--gold) !important; animation: glow 1.6s infinite; }
.lnk { display: block; width: 2px; height: 8px; margin: 0 auto; background: var(--line); }
/* crônicas */
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.chap { padding: 8px 10px; margin-bottom: 6px; background: #120b08; border: 1px solid var(--line); border-radius: 4px; }
.chap > b { display: block; font: 700 .95rem var(--title); color: var(--gold3); margin-bottom: 4px; }
.chap.done { opacity: .65; } .chap em { font-size: .85rem; color: var(--muted); }
.chap.lockc { border-style: dashed; }
.page { position: relative; padding: 10px 14px 22px; margin-bottom: 8px; background: linear-gradient(180deg, #e9d4a6, #cdb17c); color: #3a2614; border-radius: 2px; font-style: italic; line-height: 1.35; box-shadow: inset 0 0 18px rgba(90,50,10,.35); }
.page span { position: absolute; right: 12px; bottom: 4px; font-size: .82rem; }
.page.lockp { background: #1a110b; color: var(--muted); box-shadow: none; border: 1px dashed var(--line); padding-bottom: 10px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.stats > div { display: flex; justify-content: space-between; border-bottom: 1px dashed #3a2616; padding: 3px 0; font-size: .92rem; }
.stats span { color: var(--muted); } .stats b { color: var(--gold3); }
/* menu / opções */
.menu-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.menu-list.row { flex-direction: row; justify-content: center; }
.menu-list.row button { min-width: 140px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 6px 0; border-bottom: 1px dashed #3a2616; }
.opt span { flex: 1; } .opt em { width: 64px; text-align: right; font-style: normal; color: var(--gold2); }
input[type=range] { width: 200px; accent-color: var(--gold); }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold); }
/* resumo / resultado / montagem */
.sum-title { text-align: center; font: 900 1.7rem var(--title); color: var(--gold2); margin-bottom: 10px; text-shadow: 0 2px 0 #000; }
.sum-day { margin: 14px 0 4px; padding: 10px; text-align: center; font: 700 1.2rem var(--title); color: var(--gold3); border-top: 1px solid var(--line); }
.sum-day small { display: block; font: 500 .95rem var(--serif); color: var(--muted); }
.evt { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 10px; text-align: left; background: #120b08; border: 1px solid var(--gold); border-radius: 4px; }
.evt b { display: block; font: 700 1rem var(--serif); color: var(--gold2); } .evt small { font: 500 .9rem var(--serif); }
.res-ic { display: flex; justify-content: center; margin: 2px auto 8px; padding: 10px; width: 130px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 35%, transparent), transparent 70%); }
.res-ic.leg { animation: legglow 1.4s infinite; }
@keyframes legglow { 50% { filter: drop-shadow(0 0 12px var(--gold2)); } }
#res-body h2 { text-align: center; font: 700 1.35rem var(--title); color: var(--gold3); }
.leg-title { text-align: center; font: italic 600 1.2rem var(--serif); color: var(--gold2); }
.breakdown { margin: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.breakdown > div { display: grid; grid-template-columns: 100px 1fr 44px; gap: 8px; align-items: center; font-size: .92rem; }
.breakdown span { color: var(--muted); } .breakdown b { text-align: right; color: var(--gold3); }

<script>
'use strict';
// ============================================================================
// ÁUDIO — música procedural (folk medieval) + efeitos sintetizados

const SND = (() => {
  let ctx = null, master, busM, busS, noiseBuf;

  function impulse(sec, decay) {
    const len = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, len, ctx.sampleRate);

  }
  const now = () => ctx ? ctx.currentTime : 0;
  function setVol(k, v) { vol[k] = v; if (!ctx) return; (k === 'music' ? busM : busS).out.gain.setTargetAtTime(k === 'music' ? v * duck : v, ctx.currentTime, 0.05); }

  function setDuck(v) { duck = v; if (ctx) busM.out.gain.setTargetAtTime(vol.music * v, ctx.currentTime, 0.25); }

  // ---------- primitivas ----------
  function tone(dst, type, f, t, dur, v, o = {}) {
    const os = ctx.createOscillator(), g = ctx.createGain();
    os.type = type; os.frequency.setValueAtTime(f, t);
    if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + (o.fd || dur));
    if (o.det) os.detune.value = o.det;
    let n = os;
    if (o.lp || o.bp || o.hp) {

      fl.Q.value = o.q || 0.8; os.connect(fl); n = fl;
    }
    n.connect(g); g.connect(dst);
    const a = o.a || 0.004;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a);
    if (o.sus) { g.gain.setValueAtTime(v, Math.max(t + a, t + dur - o.sus)); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (o.vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * o.vib, t + 0.35); l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + dur + 0.1); }
    os.start(t); os.stop(t + dur + 0.05);

  }

    s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = o.q || 1;

    choir(d, m, t, v, dur) {
      const f = mf(m);

        const o = ctx.createOscillator(), gg = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;

  function melody(str) {
    const tk = str.split(/\s+/).filter(x => x && x !== '|'), ev = [];
    tk.forEach((x, i) => { if (x === '-') { if (ev.length) ev[ev.length - 1].len++; } else if (x !== '.') ev.push({ step: i, m: pm(x), len: 1 }); });

  const TEMA_NOITE = 'F5 - - E5 - - | E5 - - C5 - - | D5 - - - - . | C5 - - A4 - - | Bb4 - - D5 - - | A4 - - F4 - - | E4 - - C5 - - | D5 - - - - .';
  const TRACKS = {
    oficina: {
      sd: 0.2, bar: 6, drone: [38, 45], order: 'A B C B2 D E C A',
      parts: {
        A: { chords: 'Dm Dm Bb Bb F F Am Am', arp: [0, 1, 2, 3, 2, 1], arpI: 'harp', arpV: 0.1, drum: '......', layers: 'pad' },
        B: { chords: 'Dm C Dm Am F C Gm Dm', arp: [0, 1, 2, 3, 2, 1], arpV: 0.1, drum: 'X..x.t', bass: 1, melI: 'flute', melV: 0.13, mel: TEMA1 },
        B2: { chords: 'Dm C Dm Am F C Gm Dm', arp: [0, 1, 2, 3, 2, 1], arpV: 0.09, drum: 'X..x.t', bass: 1, layers: 'pad', melI: 'flute', melV: 0.13, mel: TEMA1, mel2I: 'harp', mel2V: 0.05, mel2: '@12' },
        C: {
          chords: 'F C Gm Dm F C Am Dm', arp: [0, 2, 1, 3, 2, 1], arpV: 0.09, drum: 'X.tx.t', bass: 1, layers: 'pad', melI: 'strings', melV: 0.11,
          mel: 'A5 - G5 F5 - E5 | G5 - F5 E5 - C5 | D5 - E5 F5 - G5 | A5 - - - - . | A5 - G5 F5 - A5 | G5 - E5 C5 - E5 | E5 - D5 C5 - A4 | D5 - - - - .',

const SKILL_TREE = (() => {
  const C = [320, 250], pos = (ang, r) => [Math.round(C[0] + Math.cos(ang) * r), Math.round(C[1] + Math.sin(ang) * r)], list = [];
  list.push(Object.assign({ tier: 0, req: [], cost: 0, lvl: 1, xy: C, br: null }, SKILL_ROOT));
  SKILL_ORDER.forEach((bid, k) => {
    const br = SKILLS.find(b => b.id === bid), ang = (-90 + k * 60) * Math.PI / 180;
    br.nodes.forEach((n, i) => list.push(Object.assign({}, n, { tier: i + 1, icon: br.icon, br, req: [i ? br.nodes[i - 1].id : 'raiz'], cost: TIER_COST[i], lvl: TIER_LVL[i], xy: pos(ang, TIER_RAD[i]), ang })));
  });
  SKILL_HYB.forEach(hy => {
    const ka = SKILL_ORDER.indexOf(hy.a), ang = (-60 + ka * 60) * Math.PI / 180;
    list.push(Object.assign({}, hy, { tier: 'h', req: [hy.a + '1', hy.b + '1'], cost: 2, lvl: 4, xy: pos(ang, 116), br: null }));
  });
  return list;
})();
const skNode = id => SKILL_TREE.find(n => n.id === id);

  if (!cands.length) return;
  const it = cands[0]; S.items.splice(S.items.indexOf(it), 1);
  const late = o.status === 'atrasada', gold = Math.round(o.gold * (late ? 0.5 : 1) * (it.qi > o.qi ? 1.1 : 1));
  o.status = 'concluida'; o.done = S.day;
  addGold(gold); const rp = addRep(late ? Math.ceil(o.rep / 3) : o.rep + (it.qi > o.qi ? 2 : 0));
  S.stats.ordersDone++; SND.fx.coin();
  const cl = S.clients[o.cid]; if (cl) { cl.bought++; cl.lastItem = it.name; }
  UI.toast('Encomenda de ' + o.cid + ' entregue: +' + gold + ' moedas, +' + rp + ' reputação' + (late ? ' (atrasada)' : '') + '.', 'moeda');

    draw(gg, t) { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); if (DRAW[type]) DRAW[type](t); },
  };
})();

    sellVila(id) { const it = S.items.find(x => x.id === id); if (!it) return; const v = Math.round(it.value * 0.6); S.items.splice(S.items.indexOf(it), 1); addGold(v); S.stats.sold++; SND.fx.coin(); toast('Vendido ao mercador da vila por ' + v + ' moedas.', 'moeda'); render(); },

    learn(id) { const n = skNode(id); if (!n || !skCan(n)) return; S.sp -= n.cost; S.skills.push(id); SND.fx.levelup(); toast('Habilidade aprendida: ' + n.name, 'rep'); render(); },

  // --------------------------------------------------------------- DIÁLOGO
  let typeT = null;
  function speaker(key, c) {
    if (c) return { name: c.name, role: c.role, look: c.look };
    const N = NPC[key]; return { name: N.name, look: N.look, letter: N.letter, narr: N.narr };
  }
  function setPortrait(look) {
    const pc = $('dlg-port'), x = pc.getContext('2d'); x.clearRect(0, 0, pc.width, pc.height);
    if (!look) { pc.classList.add('hidden'); return; } pc.classList.remove('hidden');
    x.imageSmoothingEnabled = false; const p = portrait(look); x.drawImage(p, 0, 0, 18, 16, 0, 0, pc.width, pc.height);
  }
  function dialog(lines, cb, cust) {
    dlg = { lines, i: 0, cb, cust, choice: null }; show('dialog'); step();
  }
  function step() {
    const d = dlg; if (!d) return;
    if (d.i >= d.lines.length) { show('dialog', false); dlg = null; if (d.cb) d.cb(d.choice); return; }
    const [who, txt] = d.lines[d.i], box = $('dialog');
    $('dlg-opts').innerHTML = ''; box.classList.remove('letter', 'page', 'narr');
    if (who === 'choice') {
      $('dlg-text').textContent = ''; $('dlg-name').textContent = 'Sua resposta'; setPortrait(playerLook());
      $('dlg-opts').innerHTML = txt.map(([t, id]) => `<button onclick="UI.h.pick('${id}')">${esc(t)}</button>`).join(''); return;
    }
    if (who === 'page') { box.classList.add('page'); $('dlg-name').textContent = 'Caderno de Aldric — página ' + (txt + 1); setPortrait(null); type(PAGES[txt]); SND.fx.page(); return; }
    const sp = speaker(who, d.cust);
    if (sp.letter) box.classList.add('letter'); if (sp.narr) box.classList.add('narr');
    $('dlg-name').innerHTML = esc(sp.name || '') + (sp.role ? ` <small>${esc(sp.role)}</small>` : '');
    setPortrait(sp.look || null);
    if (typeof txt === 'function') { const r = txt(); type(r.text); $('dlg-opts').innerHTML = r.opts || ''; d.opts = !!r.opts; } else { d.opts = false; type(txt.replace(/\{nome\}/g, S ? S.name : '')); }
  }
  function type(t) {
    clearInterval(typeT); const el = $('dlg-text'); let i = 0; el.textContent = ''; dlg.typing = true;
    typeT = setInterval(() => { i += 2; el.textContent = t.slice(0, i); if (i % 6 === 0) SND.fx.click && null; if (i >= t.length) { clearInterval(typeT); dlg && (dlg.typing = false); } }, 18);
    dlg.full = t;
  }
  function advance() {
    if (!dlg) return;
    if (dlg.typing) { clearInterval(typeT); $('dlg-text').textContent = dlg.full; dlg.typing = false; return; }
    if (dlg.opts || dlg.lines[dlg.i][0] === 'choice') return;
    dlg.i++; step();
  }
  h.pick = id => { if (!dlg) return; dlg.choice = id; SND.fx.click(); dlg.i++; step(); };
  h.adv = advance;

  // --------------------------------------------------------------- CLIENTES
  function customer(c) {
    const cl = c.client, A = ARCH[c.a], rq = c.req;
    let greet = c.vip ? (S.flags.vanceUpset ? 'Sargento Vance. Da última vez você me deixou na mão. Não se repita.' : 'Sargento Vance, da guarda da vila. A guarda confia na sua forja.') : (cl && cl.bought && cl.lastItem ? `Voltei! ${cl.lastItem} que você fez aguentou firme.` : pick(A.greet));
    const metTxt = m => m ? ' de ' + MATS[m].name.toLowerCase() : '';
    const done = msg => { if (msg) toast(msg, 'moeda'); leave(c); hud(); };
    const body = () => {
      if (rq.type === 'buy') {
        const cands = S.items.filter(it => it.r === rq.r && it.qi >= rq.qi).sort((a, b) => b.value - a.value);
        const price = it => Math.round(it.value * A.pay * saleMult());
        return {
          text: `${greet} Procuro ${NOUN[rq.r]}${rq.qi ? ', qualidade ' + QUAL[rq.qi].name + ' ou melhor' : ''}. Tem alguma pronta?`,
          opts: cands.slice(0, 3).map(it => `<button class="gold" onclick="UI.h.sell(${c.id},${it.id},${price(it)})">${ico(RECIPES[it.r].icon, it.m || 'ferro', 20)} Vender ${esc(it.name)} (${QUAL[it.qi].name}) — ${price(it)} moedas</button>`).join('') +
            `<button onclick="UI.h.toOrder(${c.id})">Não tenho pronta — oferecer encomenda</button><button onclick="UI.h.bye(${c.id})">Desculpe, não posso ajudar</button>`,
        };
      }
      if (rq.type === 'repair') return { text: 'Minha arma sofreu na estrada e o fio se foi. Consegue repará-la até amanhã? Pago ' + rq.gold + ' moedas.', opts: `<button class="gold" onclick="UI.h.acceptRepair(${c.id})">Aceitar o reparo</button><button onclick="UI.h.bye(${c.id})">Recusar</button>` };
      const full = S.orders.filter(o => !o.special && (o.status === 'ativa' || o.status === 'atrasada')).length >= maxOrders();
      return {
        text: `${greet} Quero encomendar ${NOUN[rq.r]}${metTxt(rq.m)}, qualidade ${QUAL[rq.qi].name} ou melhor, até o dia ${rq.due}. Pago ${rq.gold} moedas.`,
        opts: `<button class="gold" ${full ? 'disabled' : ''} onclick="UI.h.acceptOrder(${c.id})">${full ? 'Quadro de encomendas cheio' : 'Aceitar encomenda (+' + rq.rep + ' rep. na entrega)'}</button><button onclick="UI.h.bye(${c.id})">Recusar</button>`,
      };
    };
    dialog([['c', body]], null, c);
    h._c = c; h._done = done;
  }
  const findC = id => customers.find(x => x.id === id);
  h.sell = (cid, iid, price) => {
    const c = findC(cid), it = S.items.find(x => x.id === iid); if (!c || !it) return;
    S.items.splice(S.items.indexOf(it), 1); addGold(price); S.stats.sold++; S.stats.served++;
    if (c.client) { c.client.bought++; c.client.lastItem = it.name; }

    closeDlg(); toast(`${c.name} levou ${it.name} por ${price} moedas.`, 'moeda'); leave(c); checkGoals();
  };

  h.acceptOrder = cid => {

    S.orders.push({ id: S.uid++, cid: c.name, r: rq.r, m: rq.m, qi: rq.qi, due: rq.due, gold: rq.gold, rep: rq.rep, imp: rq.imp, status: 'ativa' });
    S.stats.served++; SND.fx.open(); closeDlg(); toast('Encomenda aceita: ' + RECIPES[rq.r].name + (rq.m ? ' de ' + MATS[rq.m].name : '') + ' para o dia ' + rq.due + '.', 'pedidos'); leave(c); checkGoals();

      ${sm.cancel ? `<p class="red">${sm.cancel} encomenda(s) cancelada(s) por atraso.</p>` : ''}${sm.late ? `<p class="warn">${sm.late} encomenda(s) atrasada(s): entregue hoje para receber metade.</p>` : ''}${sm.warn ? `<p class="warn">${sm.warn} encomenda(s) vencem hoje.</p>` : ''}
      <div class="sum-day">Dia ${S.day}${S.event ? `<div class="evt">${ico(S.event.icon, 'ferro', 28)}<div><b>${S.event.name}</b><small>${S.event.desc}</small></div></div>` : '<small>Um novo dia de trabalho começa.</small>'}</div>
      <p class="note center">Progresso salvo automaticamente.</p><div class="menu-list"><button class="gold big" onclick="UI.h.sumok()">Abrir a oficina</button></div>`;
    show('summary'); h.sumok = () => { show('summary', false); hud(); cb && cb(); };
  }
  function result(it, sc, special, cb) {
    const R = RECIPES[it.r], ST = { heat: 'Aquecimento', hammer: 'Ritmo', quench: 'Têmpera', sharpen: 'Fio', cabo: 'Cabo', assemble: 'Montagem' };
    const ord = !special && S.orders.find(o => (o.status === 'ativa' || o.status === 'atrasada') && orderMatch(o, it));
    $('res-body').innerHTML = `<div class="res-ic ${it.rar === 3 ? 'leg' : ''}" style="--c:${it.rar ? RAR[it.rar].col : QUAL[it.qi].col}">${ico(R.icon, it.m || 'ferro', 96)}</div>
      <h2>${esc(special ? (it.r === 'tenkai' ? 'Tenkai — fio restaurado' : 'Reparo concluído') : it.name)}</h2>${it.title ? `<div class="leg-title">«${esc(it.title)}»</div>` : ''}
      <div class="meta center">${qtag(it.qi)} ${rtag(it.rar)} ${it.rune ? '<span class="tag" style="--c:#43c8d8">Runa</span>' : ''}${it.wood ? `<span class="tag" style="--c:${WOODPAL[it.wood][3]}">Cabo de ${MATS[it.wood].name}</span>` : ''}</div>
      <div class="breakdown">${Object.keys(ST).filter(k => sc[k] !== undefined).map(k => `<div><span>${ST[k]}</span><i><u style="width:${Math.round(sc[k] * 100)}%"></u></i><b>${Math.round(sc[k] * 100)}%</b></div>`).join('')}<div><span>Nota final</span><i><u style="width:${Math.round(it.score * 100)}%"></u></i><b>${Math.round(it.score * 100)}%</b></div></div>
      ${special ? '' : `<div class="val">Valor: <b class="gold-t">${it.value}</b> moedas</div>`}${ord ? `<p class="ok center">Esta peça atende a encomenda de ${esc(ord.cid)}.</p>` : ''}
      <div class="menu-list"><button class="gold big" onclick="UI.h.resok()">${special ? 'Entregar' : 'Guardar no estoque'}</button></div>`;
    show('result'); SND.fx.page();
    h.resok = () => { show('result', false); cb && cb(); };
  }
  function assembly(opts, cb, titulo) {
    $('asm-body').innerHTML = `<div class="lbl">${esc(titulo || 'Montagem e acabamento')}</div><div class="asm">${opts.map(o => `<button ${o.ok ? '' : 'disabled'} onclick="UI.h.asm('${o.id}')"><b>${o.t}</b><small>${o.d}</small></button>`).join('')}</div>`;
    show('assembly'); h.asm = id => { show('assembly', false); SND.fx.click(); cb(id); };
  }
  function closeAssembly() { show('assembly', false); }
  function miniHUD(step, w, hint) {
    show('hud', !step);
    if (!step) { show('minihud', false); return; }
    const R = RECIPES[w.r];
    if (w.titulo) { $('mh-top').innerHTML = `${ico('madeira', w.torno.w, 28)}<b>${esc(w.titulo)}</b>`; $('mh-hint').innerHTML = `${esc(hint)} <kbd>Esc</kbd> interromper`; show('minihud'); return; }
    $('mh-top').innerHTML = `${ico(R.icon, w.m || 'ferro', 28)}<b>${esc(w.r === 'tenkai' ? 'Tenkai' : itemName(w.r, w.m))}</b><span class="chips">${R.steps.map((s, i) => `<span class="chip ${i < w.step ? 'ok' : i === w.step ? 'cur' : ''}">${STEP[s].name}</span>`).join('')}</span>`;
    $('mh-hint').innerHTML = `${esc(hint)} <kbd>Esc</kbd> interromper`;
    show('minihud');
  }

  // --------------------------------------------------------------- TÍTULO
  let newLook = { skin: 2, hair: 1, style: 'short' }, newSlot = 1;
  function title() {
    mode = 'title'; S = null; show('hud', false); closeAll(); show('title');
    SND.playMusic('menu');
    const last = LS.get('forja_last', null), li = last && slotInfo(last);
    $('title-menu').innerHTML = `
      ${li ? `<button class="gold big" onclick="UI.h.load(${last})">Continuar <small>${esc(li.name)} · Dia ${li.day}</small></button>` : ''}
      <button class="${li ? '' : 'gold'} big" onclick="UI.h.slots('new')">Novo jogo</button>
      <button class="big" onclick="UI.h.slots('load')">Carregar</button>
      <button class="big" onclick="UI.panel('opcoes')">Opções</button>
      <button class="big" onclick="UI.panel('ajuda')">Como jogar</button>`;
  }
  h.slots = kind => {
    SND.init(); SND.playMusic('menu'); SND.fx.page();
    $('title-menu').innerHTML = `<div class="lbl">${kind === 'new' ? 'Escolha um encaixe para o novo jogo' : 'Carregar jogo'}</div>` + [1, 2, 3].map(n => {
      const i = slotInfo(n);
      return `<div class="slot">${i ? `<div><b>${esc(i.name)}</b><small>Dia ${i.day} · ${i.gold} moedas · reputação ${i.rep} · capítulo ${Math.min(i.chapter, 5)}</small></div>` : `<div><b>Encaixe ${n}</b><small>Vazio</small></div>`}
        ${kind === 'new' ? `<button class="gold" onclick="UI.h.newIn(${n}, ${!!i})">${i ? 'Sobrescrever' : 'Usar'}</button>` : i ? `<button class="gold" onclick="UI.h.load(${n})">Carregar</button><button class="danger" onclick="UI.h.del(${n})">Apagar</button>` : ''}</div>`;
    }).join('') + `<button class="big" onclick="UI.h.back()">Voltar</button>`;
  };
  h.back = () => { SND.fx.close(); title(); };
  h.del = n => confirm('Apagar o jogo do encaixe ' + n + '? Isto não pode ser desfeito.', () => { LS.del('forja_slot_' + n); if (LS.get('forja_last') === n) LS.del('forja_last'); h.slots('load'); }, 'Apagar');
  h.load = n => { SND.init(); const s = slotInfo(n); if (!s) return; startGame(s, false); };
  h.newIn = (n, exists) => { if (exists) return confirm('Sobrescrever o jogo do encaixe ' + n + '?', () => h.newIn(n, false), 'Sobrescrever'); newSlot = n; creator(); };
  function creator() {
    $('title-menu').innerHTML = `<div class="lbl">Quem herda a oficina?</div>
      <div class="creator"><canvas id="cr-prev" width="96" height="144"></canvas><div>
        <label class="field"><span>Nome</span><input id="cr-name" maxlength="16" value="Ari" spellcheck="false"></label>
        <div class="field"><span>Pele</span><div class="sw">${PAL.skin.map((s, i) => `<button class="${newLook.skin === i ? 'on' : ''}" style="background:${s[1]}" onclick="UI.h.look('skin',${i})"></button>`).join('')}</div></div>
        <div class="field"><span>Cabelo</span><div class="sw">${PAL.hair.map((s, i) => `<button class="${newLook.hair === i ? 'on' : ''}" style="background:${s[1]}" onclick="UI.h.look('hair',${i})"></button>`).join('')}</div></div>
        <div class="field"><span>Corte</span><div class="sw txt"><button class="${newLook.style === 'short' ? 'on' : ''}" onclick="UI.h.look('style','short')">Curto</button><button class="${newLook.style === 'long' ? 'on' : ''}" onclick="UI.h.look('style','long')">Longo</button><button class="${newLook.style === 'bald' ? 'on' : ''}" onclick="UI.h.look('style','bald')">Raspado</button></div></div>
      </div></div>
      <button class="gold big" onclick="UI.h.begin()">Acender a forja</button><button class="big" onclick="UI.h.slots('new')">Voltar</button>`;
    const pc = $('cr-prev'), x = pc.getContext('2d'); x.imageSmoothingEnabled = false;
    const o = { skin: PAL.skin[newLook.skin], hair: PAL.hair[newLook.hair], hairStyle: newLook.style, top: ['#3a2a22', '#5a4334', '#7a5e48'], apron: PAL.leather.slice(1, 4), belt: PAL.leather[0], legs: ['#2a2230', '#3a3142'] };
    x.drawImage(spr(16, 24, d => drawChar(d, o, 'down', 0)), 0, 0, 18, 26, 0, 0, 96 * 18 / 16, 144 * 26 / 24);
  }
  h.look = (k, v) => { const nm = $('cr-name') ? $('cr-name').value : 'Ari'; newLook[k] = v; creator(); $('cr-name').value = nm; SND.fx.click(); };
  h.begin = () => {
    const name = ($('cr-name').value || 'Ari').trim().slice(0, 16) || 'Ari';
    const st = newState(newSlot, name, Object.assign({}, newLook)); st.spawnLeft = 3;
    LS.set('forja_slot_' + newSlot, st); LS.set('forja_last', newSlot);
    startGame(st, true);
  };

  // --------------------------------------------------------------- TECLADO
  function keydown(e) {
    const c = e.code, act = c === 'Space' || c === 'KeyE' || c === 'Enter' || c === 'NumpadEnter';
    if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.activeElement.type === 'text') return c !== 'Escape' ? true : (document.activeElement.blur(), true);
    if (isOpen('result')) { if (act) { e.preventDefault(); h.resok(); } return true; }
    if (isOpen('summary')) { if (act) { e.preventDefault(); h.sumok(); } return true; }
    if (isOpen('modal')) { if (c === 'Escape') h.mno(); else if (act && e.code !== 'Space') { e.preventDefault(); h.mok(); } return true; }
    if (isOpen('assembly')) { if (c === 'Escape' && mode === 'mini') MINI.quit(); return true; }
    if (dlg) { if (act) { e.preventDefault(); if (!e.repeat) advance(); } else if (c === 'Escape' && dlg.cust) { const cc = dlg.cust; closeDlg(); } else if (/^Digit[1-4]$/.test(c)) { const b = $('dlg-opts').querySelectorAll('button:not([disabled])')[+c.slice(5) - 1]; if (b) b.click(); } return true; }
    if (open) { if (c === 'Escape' || (c === 'KeyQ' && open === 'pedidos') || (c === 'KeyI' && open === 'estoque') || (c === 'KeyK' && open === 'habilidades') || (c === 'KeyU' && open === 'oficina') || (c === 'KeyJ' && open === 'cronicas')) { e.preventDefault(); if (open === 'merchant') h.rclose(); else if (open === 'opcoes' && S) panel('menu'); else closePanel(); } return true; }
    if (isOpen('title')) return true;
    return false;
  }

  // --------------------------------------------------------------- INICIALIZAÇÃO
  function init() {
    $('panel-close').onclick = () => { if (open === 'merchant') h.rclose(); else closePanel(); };
    $('dialog').addEventListener('click', e => { if (e.target.tagName !== 'BUTTON') advance(); });
    $('prompt').addEventListener('click', () => interact());
    document.querySelectorAll('#hud-btns button').forEach(b => b.onclick = () => { SND.init(); const p = b.dataset.p; p === 'receitas' ? recipeBook() : panel(p, b.dataset.t); });
    document.querySelectorAll('#hud-btns button').forEach(b => { b.innerHTML = ico(b.dataset.i, 'ferro', 26) + `<span>${b.dataset.l}</span>`; });
    document.querySelectorAll('#pad [data-d]').forEach(b => {
      const d = b.dataset.d, on = e => { e.preventDefault(); pad[d] = 1; if (mode === 'mini') { if (MINI.type === 'hammer') MINI.press({ d: 0, l: 1, r: 2, u: 3 }[d]); else MINI.press2(); } }, off = e => { e.preventDefault(); pad[d] = 0; if (mode === 'mini' && MINI.type === 'hammer') MINI.release(); };
      b.addEventListener('touchstart', on, { passive: false }); b.addEventListener('touchend', off, { passive: false }); b.addEventListener('touchcancel', off);
    });
    $('pad-act').addEventListener('touchstart', e => { e.preventDefault(); SND.init(); if (mode === 'mini') { if (MINI.type === 'hammer') MINI.press2(); else MINI.press(); } else if (!blocking()) interact(); }, { passive: false });
    $('pad-act').addEventListener('touchend', e => { e.preventDefault(); if (mode === 'mini') MINI.release(); }, { passive: false });
    $('logo-emblem').innerHTML = ico('forja', 'ouro', 64);
    document.addEventListener('pointerdown', () => SND.init(), { once: true });
    title();
  }
  function recipeBook() { tab = 'receitas'; panel('estoque'); }

  return { init, hud, prompt, toast, enterGame, panel, closePanel, blocking, dialog, customer, merchant, confirm, alert, wipMenu, summary, result, assembly, closeAssembly, miniHUD, recipeBook, keydown, h, pad, ico };
})();

ART.build();

UI.init();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
